name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte für das Pages-Deployment via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Deploys nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (next build → statischer Export nach out/)
        run: npm run build
        env:
          # Adresse des Produkt-Import-Workers (siehe worker/README.md).
          # Sie steht als Repository-Variable, nicht im Klartext hier: so
          # lässt sie sich nach einem Neu-Deploy des Workers ändern, ohne
          # den Workflow anzufassen. Ist sie nicht gesetzt, bleibt die
          # Import-Fläche in der Library aus und die App läuft wie bisher.
          # Anlegen unter Settings → Secrets and variables → Actions →
          # Variables → New repository variable.
          NEXT_PUBLIC_IMPORT_WORKER_URL: ${{ vars.NEXT_PUBLIC_IMPORT_WORKER_URL }}

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
